name: nvim-config

on:
  push:
    branches:
      - '**'
  # Weekly canary, on the default branch. Two jobs, each changing one thing:
  #   - pinned nvim + newest plugin commits: catches upstream plugin breakage
  #     before a local `:Lazy update` does.
  #   - newest nvim release + pinned plugins: catches nvim breakage before
  #     vim/safe-update-nvim.sh installs the release.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  # Allow triggering a run by hand. vim/safe-update-nvim.sh uses nvim_version
  # to test a new release before installing it locally.
  workflow_dispatch:
    inputs:
      nvim_version:
        description: 'Neovim version to test (e.g. v0.12.5); defaults to vim/.nvim-version'
        required: false
        default: ''
      weekly:
        description: 'Run the weekly canary jobs instead (ignores nvim_version)'
        type: boolean
        default: false

jobs:
  test:
    name: Verify Neovim config (nvim ${{ matrix.nvim }}, plugins ${{ matrix.plugins }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.weekly) && '[{"nvim":"pinned","plugins":"latest"},{"nvim":"latest","plugins":"pinned"}]' || '[{"nvim":"pinned","plugins":"pinned"}]') }}
    timeout-minutes: 15
    env:
      # Isolated, cacheable XDG environment that vim/tests/run.sh will reuse.
      XDG_CONFIG_HOME: ${{ github.workspace }}/.xdg/config
      XDG_DATA_HOME: ${{ github.workspace }}/.xdg/data
      XDG_STATE_HOME: ${{ github.workspace }}/.xdg/state
      XDG_CACHE_HOME: ${{ github.workspace }}/.xdg/cache
      # "latest" floats plugins to their newest commits; "pinned" tests the
      # exact versions in lazy-lock.json.
      LAZY_MODE: ${{ matrix.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The "Install Neovim <version>" step name below is read by
      # vim/safe-update-nvim.sh to tell which version a run tested.
      - name: Resolve Neovim version
        id: nvim-pin
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ !inputs.weekly && inputs.nvim_version || '' }}
          WANT_LATEST: ${{ matrix.nvim == 'latest' }}
        run: |
          if [ "$WANT_LATEST" = true ]; then
            version=$(gh api repos/neovim/neovim/releases/latest --jq .tag_name)
          else
            version=${OVERRIDE:-$(cat vim/.nvim-version)}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Neovim ${{ steps.nvim-pin.outputs.version }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ steps.nvim-pin.outputs.version }}

      - name: Install build dependencies
        # build-essential provides the C compiler tree-sitter parsers need.
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Record Neovim version
        id: nvim
        run: echo "version=$(nvim --version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Restore the lazy.nvim plugin directory. The key folds in the lockfile
      # (the authoritative version identifier) and the plugin specs, so an exact
      # hit means identical plugin versions; the restore-keys prefixes warm-start
      # from the latest cache for this OS + Neovim version + mode when versions
      # have moved. Mode is part of the key so the floating canary never feeds
      # newer commits into the pinned cache.
      - name: Restore plugin cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XDG_DATA_HOME }}/nvim/lazy
          key: lazy-${{ runner.os }}-${{ steps.nvim.outputs.version }}-${{ env.LAZY_MODE }}-${{ hashFiles('vim/lazy-lock.json', 'vim/lua/plugins/**/*.lua', 'vim/init.lua') }}
          restore-keys: |
            lazy-${{ runner.os }}-${{ steps.nvim.outputs.version }}-${{ env.LAZY_MODE }}-
            lazy-${{ runner.os }}-${{ steps.nvim.outputs.version }}-

      - name: Run config tests
        run: ./vim/tests/run.sh

      # Hash the lock file lazy wrote during the test run. This pins the exact
      # commit of every plugin, so it is the authoritative version identifier.
      - name: Hash resolved plugin versions
        id: lock
        if: always()
        run: |
          lock="$XDG_CONFIG_HOME/nvim/lazy-lock.json"
          if [ -f "$lock" ]; then
            echo "hash=$(sha256sum "$lock" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Save plugin cache
        if: always() && steps.lock.outputs.hash != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XDG_DATA_HOME }}/nvim/lazy
          key: lazy-${{ runner.os }}-${{ steps.nvim.outputs.version }}-${{ env.LAZY_MODE }}-${{ steps.lock.outputs.hash }}
